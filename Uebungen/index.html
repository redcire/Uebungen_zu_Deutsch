let currentRound = 0;
let totalPoints = 0;
let roundPoints = 0;

const sentencesDiv = document.getElementById("sentences");
const feedback = document.getElementById("feedback");
const checkButton = document.getElementById("checkButton");
const nextButton = document.getElementById("nextButton");

function createDots() {
    const dots = document.getElementById("roundDots");
    dots.innerHTML = "";

    for (let i = 0; i < rounds.length; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";

        if (i < currentRound) {
            dot.classList.add("done");
        } else if (i === currentRound) {
            dot.classList.add("current");
        }

        dot.textContent = i + 1;
        dots.appendChild(dot);
    }
}

function showRound() {

    const round = rounds[currentRound];

    document.getElementById("roundText").textContent =
        `Runde ${currentRound + 1} von ${rounds.length}`;

    document.getElementById("scoreText").textContent =
        `Punkte: ${totalPoints}`;

    document.getElementById("progressFill").style.width =
        `${((currentRound + 1) / rounds.length) * 100}%`;

    document.getElementById("exerciseTitle").textContent =
        `Runde ${currentRound + 1}`;

    sentencesDiv.innerHTML = "";

    /*
       Jede Runde enthält zwei Sätze.
       Die vier Lücken werden durch die vier Inputfelder erzeugt.
    */

    let inputNumber = 0;

    round.sentences.forEach((sentence) => {

        const sentenceDiv = document.createElement("div");
        sentenceDiv.className = "sentence";

        const parts = sentence.split(/(\[[^\]]+\])/g);

        parts.forEach(part => {

            if (part.startsWith("[") && part.endsWith("]")) {

                const input = document.createElement("input");

                input.type = "text";
                input.className = "answer";
                input.dataset.number = inputNumber;

                sentenceDiv.appendChild(input);

                inputNumber++;

            } else {

                sentenceDiv.appendChild(
                    document.createTextNode(part)
                );

            }

        });

        sentencesDiv.appendChild(sentenceDiv);
    });

    feedback.className = "feedback";
    feedback.innerHTML = "";

    checkButton.style.display = "inline-block";
    nextButton.style.display = "none";

    createDots();
}

function checkAnswers() {

    const inputs = document.querySelectorAll(".answer");

    roundPoints = 0;

    inputs.forEach(input => {
        input.classList.remove("correct", "wrong");
    });

    let explanations = [];

    inputs.forEach((input, index) => {

        const answer = input.value.trim();
        const correctAnswer = rounds[currentRound].words[index].answer;

        if (answer === correctAnswer) {

            input.classList.add("correct");
            roundPoints++;

        } else {

            input.classList.add("wrong");

            explanations.push(`
                <div class="explanation">
                    <strong>Lücke ${index + 1}:</strong>
                    Richtig wäre <strong>${correctAnswer}</strong>.<br>
                    ${rounds[currentRound].words[index].explanation}
                </div>
            `);
        }
    });

    totalPoints += roundPoints;

    document.getElementById("scoreText").textContent =
        `Punkte: ${totalPoints}`;

    if (roundPoints === 4) {

        feedback.className = "feedback success";

        const messages = [
            "🌟 Super! Alle vier Antworten sind richtig!",
            "🎉 Klasse! Du hast alle Lücken richtig ausgefüllt!",
            "👏 Hervorragend! Du beherrschst die Regeln richtig gut!",
            "💪 Stark! Vier von vier – weiter so!",
            "⭐ Perfekt! Das war eine richtig gute Runde!"
        ];

        feedback.innerHTML =
            `<strong>${messages[currentRound % messages.length]}</strong><br>
             Du bekommst 4 Punkte für diese Runde.`;

    } else if (roundPoints > 0) {

        feedback.className = "feedback partial";

        feedback.innerHTML =
            `<strong>👍 Gut gemacht!</strong><br>
             Du hast ${roundPoints} von 4 Antworten richtig.
             Schau dir die Erklärungen an – damit kannst du es beim nächsten Mal noch besser machen.
             ${explanations.join("")}`;

    } else {

        feedback.className = "feedback error";

        feedback.innerHTML =
            `<strong>💡 Noch nicht richtig – aber genau dafür ist Üben da!</strong><br>
             Lies dir die Erklärungen in Ruhe durch. Du kannst die Regeln beim nächsten Versuch anwenden.
             ${explanations.join("")}`;
    }

    checkButton.style.display = "none";

    if (currentRound < rounds.length - 1) {
        nextButton.style.display = "inline-block";
    } else {
        nextButton.textContent = "Auswertung anzeigen →";
        nextButton.style.display = "inline-block";
    }

    createDots();
}

function nextRound() {

    currentRound++;

    if (currentRound >= rounds.length) {
        showResult();
        return;
    }

    showRound();
}

function showResult() {

    document.getElementById("exerciseCard").style.display = "none";
    document.querySelector(".progress-area").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent =
        `${totalPoints} / 80 Punkte`;

    let message = "";

    if (totalPoints >= 72) {

        message = `
            🌟 <strong>Fantastische Leistung!</strong><br><br>
            Du hast die Regeln zur Groß- und Kleinschreibung und zu
            „das“ und „dass“ schon sehr sicher angewendet.
            Du kannst wirklich stolz auf dich sein!
        `;

    } else if (totalPoints >= 60) {

        message = `
            🎉 <strong>Sehr gut gemacht!</strong><br><br>
            Du hast schon viel über die Rechtschreibregeln gelernt.
            Mit ein wenig weiterer Übung wirst du noch sicherer.
        `;

    } else if (totalPoints >= 40) {

        message = `
            👍 <strong>Gut gearbeitet!</strong><br><br>
            Du hast schon wichtige Regeln erkannt.
            Lies dir die Erklärungen noch einmal durch und übe weiter.
            Jeder Fehler hilft dir dabei, die Regeln besser zu verstehen.
        `;

    } else {

        message = `
            💪 <strong>Gut, dass du geübt hast!</strong><br><br>
            Einige Regeln sind noch knifflig. Das ist völlig normal.
            Schau dir besonders die Erklärungen zu den Wortarten an
            und versuche es anschließend noch einmal.
            Du wirst merken, dass es beim nächsten Durchgang leichter wird!
        `;
    }

    document.getElementById("resultMessage").innerHTML = message;
}

function restart() {

    currentRound = 0;
    totalPoints = 0;
    roundPoints = 0;

    document.getElementById("exerciseCard").style.display = "block";
    document.querySelector(".progress-area").style.display = "block";
    document.getElementById("result").style.display = "none";

    showRound();
}

showRound();

</script>

</body>
</html>
